    <text x="14" y="108" fill="#64748B" font-size="10">Duty Schedules, Leaves</text>

    <!-- Coll 3 -->
    <rect x="0" y="132" width="168" height="56" rx="8" fill="#061A15" stroke="#1F5A4C" stroke-width="1"/>
    <text x="14" y="156" fill="#34D399" font-size="12" font-weight="700">diagnostic_reports</text>
    <text x="14" y="174" fill="#64748B" font-size="10">Lab Status, Test Types</text>

    <!-- Coll 4 -->
    <rect x="0" y="198" width="168" height="56" rx="8" fill="#061A15" stroke="#1F5A4C" stroke-width="1"/>
