  <rect x="270" y="90" width="220" height="42" rx="16" fill="#241B12"/>
  <text x="290" y="117" fill="#FB923C" font-size="13" font-weight="800" letter-spacing="0.5">2. SARVAM AI VOICE STACK</text>

