  <rect x="30" y="90" width="220" height="42" rx="16" fill="#143A30"/>
  <text x="50" y="117" fill="#5EEAD4" font-size="13" font-weight="800" letter-spacing="0.5">1. INBOUND CHANNELS</text>

  <!-- Channel 1: Mobile Carrier -->
  <rect x="46" y="148" width="188" height="92" rx="10" fill="#061A15" stroke="#1F5A4C" stroke-width="1"/>
  <text x="60" y="174" fill="#FFFFFF" font-size="13" font-weight="700">Mobile Phone / Landline</text>
  <text x="60" y="194" fill="#00C9A7" font-size="12" font-weight="800">+91 80642 69783</text>
  <text x="60" y="210" fill="#00C9A7" font-size="11" font-weight="600">or 08064269783 (STD)</text>
  <text x="60" y="228" fill="#64748B" font-size="10">Standard Telecom Carrier PSTN</text>

  <!-- Channel 2: Web Browsers -->
  <rect x="46" y="254" width="188" height="92" rx="10" fill="#061A15" stroke="#1F5A4C" stroke-width="1"/>
  <text x="60" y="280" fill="#FFFFFF" font-size="13" font-weight="700">Web Browser Client</text>
  <text x="60" y="300" fill="#38BDF8" font-size="12" font-weight="600">Desktop &amp; Mobile Web</text>
  <text x="60" y="318" fill="#64748B" font-size="10">iOS Safari / Android Chrome</text>
  <text x="60" y="334" fill="#64748B" font-size="10">Web Audio API · Signed WSS</text>

