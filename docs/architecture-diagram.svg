  <path d="M 234 300 C 370 300, 370 178, 524 178" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowBlue)"/>
  
  <!-- Proxy to Sarvam Agent (Signed WSS) -->
  <path d="M 524 185 C 490 185, 490 280, 476 280" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="3" marker-end="url(#arrowBlue)"/>

  <!-- Sarvam Voice Agent to Backend Tools -->
  <path d="M 474 311 L 524 250" stroke="#00C9A7" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 474 311 L 524 388" stroke="#00C9A7" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 474 311 L 524 457" stroke="#00C9A7" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Sarvam Webhook to Backend -->
  <path d="M 380 474 C 380 523, 450 523, 524 523" fill="none" stroke="#A855F7" stroke-width="1.8" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Backend to MongoDB Atlas -->
  <path d="M 734 249 L 784 178" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 734 319 L 784 244" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 734 388 L 784 310" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 734 457 L 784 376" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 734 523 L 784 442" stroke="#34D399" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

