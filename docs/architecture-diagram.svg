    <text x="14" y="306" fill="#64748B" font-size="10">Audio URLs, Transcripts</text>

    <!-- Coll 6 -->
    <rect x="0" y="330" width="168" height="84" rx="8" fill="#0C1F1A" stroke="#164E40" stroke-width="1"/>
    <text x="14" y="354" fill="#5EEAD4" font-size="11" font-weight="700">Security &amp; Encryption</text>
    <text x="14" y="372" fill="#94A3B8" font-size="10">• TLS/SSL Connection</text>
    <text x="14" y="388" fill="#94A3B8" font-size="10">• Zero-Secret Frontend</text>
    <text x="14" y="404" fill="#94A3B8" font-size="10">• Motor Async Driver</text>
  </g>

  <!-- CONNECTING ARROWS -->
  <!-- Phone to Telephony Gateway -->
  <path d="M 234 194 L 286 194" stroke="#F97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  
