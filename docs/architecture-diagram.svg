  <text x="60" y="492" fill="#FFFFFF" font-size="13" font-weight="700">11m Walkthrough Demo</text>
  <text x="60" y="512" fill="#34D399" font-size="11" font-weight="600">Embedded Video Player</text>
  <text x="60" y="530" fill="#94A3B8" font-size="10">Google Drive Mirror Link</text>
  <text x="60" y="552" fill="#00C9A7" font-size="10" font-weight="700">Interactive Chapter Jumps</text>

