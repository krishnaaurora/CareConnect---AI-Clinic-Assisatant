  <text x="300" y="330" fill="#94A3B8" font-size="10">Deploy: CareConnect-4425953e</text>
  <text x="300" y="348" fill="#5EEAD4" font-size="10" font-weight="600">Dynamic Tool-Calling Engine</text>

