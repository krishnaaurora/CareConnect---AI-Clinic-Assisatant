  <text x="538" y="396" fill="#F43F5E" font-size="10">Phone + Multi-Format DOB Verification</text>
  <text x="538" y="412" fill="#64748B" font-size="9">Medical Privacy &amp; Data Quarantining</text>

  <!-- Module 5: Callback Queue -->
  <rect x="526" y="428" width="208" height="58" rx="8" fill="#061A15" stroke="#1F5A4C" stroke-width="1"/>
