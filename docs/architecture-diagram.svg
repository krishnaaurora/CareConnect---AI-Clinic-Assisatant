  <text x="300" y="174" fill="#FED7AA" font-size="13" font-weight="700">Telephony Gateway</text>
  <text x="300" y="194" fill="#F97316" font-size="12" font-weight="600">PSTN Carrier Trunk</text>
  <text x="300" y="210" fill="#94A3B8" font-size="10">Inbound DID +918064269783</text>
  <text x="300" y="226" fill="#94A3B8" font-size="10">Sub-second pickup (&lt;1s)</text>

